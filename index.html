<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏小乐园</title><style>*{box-sizing:border-box}body{margin:0;color:#4d4150;background:#fff9f5;font-family:ui-rounded,"PingFang SC","Microsoft Yahei",sans-serif;background-image:radial-gradient(#efdbe1 1.4px,transparent 1.4px);background-size:26px 26px}.wrap{max-width:970px;margin:auto;padding:48px 24px 70px}.eyebrow{font-size:12px;letter-spacing:3px;color:#c1849b;font-weight:800}h1{font-size:clamp(38px,7vw,62px);margin:14px 0;color:#634e61;letter-spacing:3px}p{line-height:1.8;color:#8c7986}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:38px}.card{display:flex;min-height:300px;flex-direction:column;text-decoration:none;color:inherit;background:white;border:1px solid #f0dee6;border-radius:26px;padding:25px;box-shadow:0 12px 30px #b3819920;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px #b3819933}.art{border-radius:18px;min-height:140px;display:grid;place-items:center;font-size:64px}.cat{background:#fdeaf1}.butterfly{background:#f1f1ef;filter:grayscale(1)}.label{color:#c58fa6;font-size:11px;font-weight:800;letter-spacing:2px;margin-top:22px}h2{margin:8px 0 0;font-size:23px}.card p{font-size:14px;margin:9px 0 18px}.go{color:#c3799c;font-weight:bold;margin-top:auto}.foot{text-align:center;margin-top:48px;color:#c3aab6;font-size:12px}@media(max-width:620px){.wrap{padding:32px 17px}.cards{grid-template-columns:1fr;gap:15px}.card{min-height:250px}.art{min-height:100px;font-size:50px}}</style></head><body><main class="wrap"><div class="eyebrow">LITTLE GAME HUB · 小小乐园</div><h1>今天玩什么？</h1><p>挑一个喜欢的游戏，给自己一点轻松的时间。<br>新游戏也会慢慢加入哦。</p><div class="cards"><a class="card" href="games/cat-huarongdao/"><div class="art cat">🐱</div><div class="label">PUZZLE · 闯关</div><h2>猫咪华容道</h2><p>和小猫们一起动脑筋，帮曹操猫找到回家的路。</p><span class="go">开始闯关 →</span></a><a class="card" href="games/mineswe
