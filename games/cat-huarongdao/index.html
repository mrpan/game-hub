.footer{text-align:center;font:11px system-ui,sans-serif;color:#a79783;margin-top:34px;letter-spacing:2px}@media(max-width:820px){.wrap{max-width:540px;padding:22px 16px 40px}.layout{display:flex;flex-direction:column;align-items:stretch;gap:20px;padding-top:28px}.title{font-size:46px;margin:11px 0}.subtitle{font-size:15px;margin-bottom:14px}.intro{line-height:1.8}.divider,.tips{display:none}.stats{margin:18px 0}.game{padding:13px}.topnote{font-size:9px}.footer{margin-top:22px}.face{font-size:19px}.piece.cao .face{font-size:29px}}

body{font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;color:#674e60;background-color:#fff5f5;background-image:radial-gradient(#f2d4df 1.5px,transparent 1.5px),radial-gradient(#f9e5d1 1.5px,transparent 1.5px);background-position:0 0,16px 16px;background-size:32px 32px}
.top{border-color:#f0dce4}.brand{color:#75526b;letter-spacing:2px}.seal{background:#eaa7bc;border-radius:12px;color:white;box-shadow:0 3px 0 #dc8da7}.topnote,.eyebrow{color:#c48ca6}.title{color:#725169;text-shadow:2px 3px #fff}.subtitle{color:#d18eab}.intro{color:#806e7a}.intro strong{color:#d27398}.divider{background:#efdce5}.tips,.stat small{color:#a18a98}.tips b,.stat strong{color:#77546d}.stat strong{font-family:ui-rounded,sans-serif}.controls button{border-radius:20px;border:1px solid #eecbd9;background:white;color:#b47596;box-shadow:0 3px 0 #f2dae4}.controls .primary{background:#e9a4bd;border-color:#e9a4bd;box-shadow:0 3px 0 #d88caa}.game{background:#ffe8f0;border:2px solid #f1cbd9;border-radius:24px;padding:18px;box-shadow:0 12px 30px #d99dbb33}.game-title{color:#b57b98;font-weight:700}.game-title span:last-child{color:#bf9dad}.frame{background:#dcaac0;border:4px solid #eec7d6;border-radius:16px;box-shadow:inset 0 2px 5px #ba849d55;padding:9px 9px 0}.board{border-radius:9px;background-color:#f9d9e5;background-image:linear-gradient(#fff6 1px,transparent 1px),linear-gradient(90deg,#fff6 1px,transparent 1px)}
.piece{padding:4px;color:#795568}.face{position:relative;border:2px solid #eac6d0;border-radius:14px;background:linear-gradient(145deg,#fffdf9,#ffeced);box-shadow:inset 0 2px #fff,0 3px 0 #ce9fb1;gap:0;font-size:15px;letter-spacing:1px;color:#78596b}.piece:nth-child(3n) .face{background:linear-gradient(145deg,#fffdf5,#f7e3c9);border-color:#efd2bd}.piece:nth-child(3n+2) .face{background:linear-gradient(145deg,#fff,#ede8f8);border-color:#dcd0ee}.piece.cao .face{background:linear-gradient(145deg,#fff9ed,#ffe3ce);border-color:#edb9ac;color:#9d6070;font-size:20px}.piece.selected .face{outline:3px solid white;outline-offset:-5px;box-shadow:0 0 0 3px #dc8eb1,0 3px 0 #ce9fb1}.cat-icon{display:block;width:58%;height:55%;max-height:83px;overflow:visible;pointer-events:none}.piece.cao .cat-icon{width:55%;height:65%;max-height:125px}.piece:not(.cao) .face small{display:none}.piece .face small{color:#c58ba1;opacity:1;font-size:9px}.piece .face .name{line-height:1.05}.exitrow{color:#fffafc;font-weight:bold;letter-spacing:3px}.exitrow:before,.exitrow:after{background:#f8e2ec}.message{color:#ab7792}.directions button{border:1px solid #ebc3d2;border-radius:15px;background:#fff;color:#d586a8;box-shadow:0 3px 0 #edcbd9}.footer{color:#c59eb1}.controls button:disabled{opacity:.45}@media(max-width:820px){.piece .face{font-size:14px}.piece.cao .face{font-size:20px}.piece .face small{font-size:8px}.game{padding:13px}}
.level-title{font:700 12px system-ui,sans-serif;color:#a97893;margin-bottom:9px}.level-list{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.level-btn{border:1px solid #ebc9d8;background:#fffafc;color:#a66e8e;border-radius:14px;padding:8px 11px;font:600 12px system-ui,sans-serif;cursor:pointer}.level-btn.active{color:#fff;background:#df91b0;border-color:#df91b0;box-shadow:0 3px 0 #c77b9c}.next{margin-left:auto;border:1px solid #dd94b1;background:#e89eb9;color:white;border-radius:14px;padding:8px 12px;font:700 12px system-ui,sans-serif;cursor:pointer}.next[hidden]{display:none}.game-title{gap:8px}.intro{margin-bottom:0}.directions button.hint-glow{background:#e89eb9;color:white;border-color:#d57b9d;box-shadow:0 0 0 4px #f2c5d9;animation:hint-pulse 1s ease-in-out infinite alternate}@keyframes hint-pulse{to{box-shadow:0 0 0 7px #f8e1eb}}@media(prefers-reduced-motion:reduce){.directions button.hint-glow{animation:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true"><symbol id="kitten" viewBox="0 0 100 90"><path d="M17 36 18 9 39 21Q50 17 61 21L82 9 83 36Q92 46 88 63 84 81 50 83 16 81 12 63 8 46 17 36Z" fill="#fffaf4" stroke="#bf929d" stroke-width="3" stroke-linejoin="round"/><path d="M23 30 23 17 34 24M77 30 77 17 66 24" fill="#f4bbca"/><ellipse cx="35" cy="50" rx="3" ry="4.5" fill="#705663"/><ellipse cx="65" cy="50" rx="3" ry="4.5" fill="#705663"/><ellipse cx="24" cy="61" rx="8" ry="4" fill="#f6c7d1"/><ellipse cx="76" cy="61" rx="8" ry="4" fill="#f6c7d1"/><path d="M47 58Q50 62 53 58M50 61Q47 67 43 63M50 61Q53 67 57 63" fill="none" stroke="#a47784" stroke-width="2.3" stroke-linecap="round"/><path d="M13 57 3 55M14 62 3 65M87 57 97 55M86 62 97 65" stroke="#c49da5" stroke-width="2" stroke-linecap="round"/></symbol></svg><main class="wrap"><header class="top"><div class="brand"><span class="seal">喵喵<br>乐园</span> 猫咪华容道</div><div class="topnote">A LITTLE PUZZLE JOURNEY</div></header><div class="layout"><section><div class="eyebrow">MEOW PUZZLE · 猫咪解谜</div><h1 class="title">猫咪华容道</h1><div class="subtitle">和小猫们一起动动脑筋</div><p class="intro">移动可爱的小猫，巧妙腾出空间，让中间的 <strong>曹操猫</strong> 从棋盘下方出口回家。一起试试吧！</p><div class="divider"></div><div class="tips"><b>怎么玩？</b><br>① 点击棋子选中，再点击方向键移动<br>② 也可以直接拖动棋子，或用键盘方向键<br>③ 每次只能移动一格，不能穿过其他棋子</div><div class="level-title">选择关卡 · 由简单到困难</div><div class="level-list" id="levels" role="group" aria-label="选择关卡"></div><div class="stats"><div class="stat"><small>移动步数</small><strong id="steps">0</strong></div><div class="stat"><small>游戏状态</small><strong style="font-size:16px;margin-top:10px" id="status">等待开始</strong></div></div><div class="controls"><button id="reset" class="primary">↻ 重新开始</button><button id="undo">↶ 撤销一步</button><button id="hint">✦ 提示一下</button></div></section><section class="game"><div class="game-title"><span id="level-name">猫咪大冒险</span><span id="level-desc"></span><button id="next" class="next" hidden>下一关 →</button></div><div class="frame"><div class="board" id="board" aria-label="华容道棋盘"></div><div class="exitrow"><span>🐾 猫咪出口 🐾</span></div></div><div class="message" id="message" aria-live="polite">选中小猫，朝空位移动</div><div class="directions" aria-label="移动方向"><button data-dir="left" aria-label="向左">←</button><button data-dir="up" aria-label="向上">↑</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div></section></div><div class="footer">喵～慢慢来，每一步都算数</div></main><script>
const initial=[{id:'cao',name:'曹操',r:0,c:1,w:2,h:2},{id:'zhang',name:'张飞',r:0,c:0,w:1,h:2},{id:'zhao',name:'赵云',r:0,c:3,w:1,h:2},{id:'ma',name:'马超',r:2,c:0,w:1,h:2},{id:'huang',name:'黄忠',r:2,c:3,w:1,h:2},{id:'guan',name:'关羽',r:2,c:1,w:2,h:1},{id:'a',name:'兵',r:3,c:1,w:1,h:1},{id:'b',name:'兵',r:3,c:2,w:1,h:1},{id:'c',name:'兵',r:4,c:0,w:1,h:1},{id:'d',name:'兵',r:4,c:3,w:1,h:1}];const levelPositions=[[[3,0],[0,0],[0,1],[0,2],[0,3],[3,2],[2,0],[2,2],[4,2],[4,3]],[[2,0],[0,0],[0,1],[0,2],[0,3],[4,2],[2,2],[3,3],[4,0],[4,1]],[[2,2],[0,0],[0,1],[2,0],[2,1],[4,2],[0,3],[1,3],[4,0],[4,1]],[[0,2],[0,0],[2,2],[3,0],[3,1],[2,0],[0,1],[1,1],[3,3],[4,2]],[[0,1],[0,0],[0,3],[2,0],[2,3],[2,1],[3,1],[3,2],[4,0],[4,3]]];const levelNames=['初来乍到','猫咪散步','绕绕弯弯','聪明猫猫','横刀立马'];const levelDistances=[5,15,30,60,116];let levelIndex=0;let pieces,selected,history,won,gesture,hintDir=null,hintRun=0;const board=document.querySelector('#board'),message=document.querySelector('#message'),statusEl=document.querySelector('#status'),stepsEl=document.querySelector('#steps');const dirs={left:[0,-1],right:[0,1],up:[-1,0],down:[1,0]};function reset(){hintRun++;hintDir=null;document.querySelector("#hint").disabled=false;pieces=initial.map((x,i)=>({...x,r:levelPositions[levelIndex][i][0],c:levelPositions[levelIndex][i][1]}));selected=null;history=[];won=false;message.textContent='选中小猫，朝空位移动';statusEl.textContent='等待开始';document.querySelector('#level-name').textContent=`第 ${levelIndex+1} 关 · ${levelNames[levelIndex]}`;document.querySelector('#level-desc').textContent=`最少 ${levelDistances[levelIndex]} 步`;document.querySelector('#next').hidden=true;document.querySelectorAll('.level-btn').forEach((b,i)=>{b.classList.toggle('active',i===levelIndex);b.setAttribute('aria-pressed',String(i===levelIndex))});render()}function canMove(p,dr,dc){let nr=p.r+dr,nc=p.c+dc;if(nr<0||nc<0||nr+p.h>5||nc+p.w>4)return false;return !pieces.some(q=>q.id!==p.id&&nr<q.r+q.h&&nr+p.h>q.r&&nc<q.c+q.w&&nc+p.w>q.c)}function move(dr,dc){if(!selected||won)return;hintRun++;hintDir=null;document.querySelector("#hint").disabled=false;let p=pieces.find(q=>q.id===selected);if(!canMove(p,dr,dc)){message.textContent='这个方向被挡住了，试试其他方向';return}history.push({id:p.id,r:p.r,c:p.c});p.r+=dr;p.c+=dc;statusEl.textContent='探索中';message.textContent='做得好，继续寻找通路';if(p.id==='cao'&&p.r===3&&p.c===1){won=true;statusEl.textContent='成功脱困';document.querySelector('#next').hidden=levelIndex===levelNames.length-1;message.textContent=`喵呜！用了 ${history.length} 步，曹操猫成功回家！`}render()}function render(){board.innerHTML='';stepsEl.textContent=history.length;pieces.forEach(p=>{const b=document.createElement('button');b.className='piece '+(p.id==='cao'?'cao ':'')+(p.id===selected?'selected':'');b.style.cssText=`left:${p.c*25}%;top:${p.r*20}%;width:${p.w*25}%;height:${p.h*20}%`;b.setAttribute('aria-label',p.name+'，第'+(p.r+1)+'行第'+(p.c+1)+'列');b.setAttribute('aria-pressed',String(p.id===selected));b.innerHTML=`<span class="face"><svg class="cat-icon" aria-hidden="true"><use href="#kitten"></use></svg><span class="name">${p.name}</span>${p.id==='cao'?'<small>猫 猫 主 将</small>':''}</span>`;b.addEventListener('pointerdown',e=>{if(won)return;gesture={x:e.clientX,y:e.clientY,id:p.id};b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',e=>{if(!gesture)return;let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;hintRun++;hintDir=null;document.querySelector('#hint').disabled=false;selected=gesture.id;gesture=null;if(Math.max(Math.abs(dx),Math.abs(dy))>20){if(Math.abs(dx)>Math.abs(dy))move(0,dx>0?1:-1);else move(dy>0?1:-1,0)}else{message.textContent=`已选中${p.name}，请选择移动方向`;render()}});board.append(b)});document.querySelectorAll('[data-dir]').forEach(b=>{const [dr,dc]=dirs[b.dataset.dir];b.disabled=!selected||won||!canMove(pieces.find(p=>p.id===selected),dr,dc);b.classList.toggle('hint-glow',b.dataset.dir===hintDir)});document.querySelector('#undo').disabled=!history.length}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(...dirs[b.dataset.dir]));const levelsEl=document.querySelector('#levels');levelNames.forEach((name,i)=>{let b=document.createElement('button');b.className='level-btn';b.textContent=`${i+1} · ${name}`;b.onclick=()=>{levelIndex=i;reset()};levelsEl.append(b)});document.querySelector('#next').onclick=()=>{if(levelIndex<levelNames.length-1){levelIndex++;reset()}};document.querySelector('#reset').onclick=reset;document.querySelector('#undo').onclick=()=>{if(!history.length)return;hintRun++;hintDir=null;document.querySelector('#hint').disabled=false;let last=history.pop(),p=pieces.find(q=>q.id===last.id);p.r=last.r;p.c=last.c;selected=p.id;won=false;document.querySelector('#next').hidden=true;statusEl.textContent=history.length?'探索中':'等待开始';message.textContent='已撤销上一步';render()};
// Search the current position, treating same-sized cats as interchangeable.
function findHint(){
 if(won){message.textContent='这一关已经完成啦！';return}
 const ticket=++hintRun, snapshot=pieces.map(p=>[p.r,p.c]), dims=pieces.map(p=>[p.w,p.h]);
 const key=arr=>[arr[0].join(','),arr[5].join(','),arr.slice(1,5).map(p=>p[0]*4+p[1]).sort((a,b)=>a-b).join(','),arr.slice(6).map(p=>p[0]*4+p[1]).sort((a,b)=>a-b).join(',')].join('|');
 const queue=[{a:snapshot,first:null}],seen=new Set([key(snapshot)]);let head=0;
 const options=[['up',-1,0,'上'],['down',1,0,'下'],['left',0,-1,'左'],['right',0,1,'右']];
 const button=document.querySelector('#hint');button.disabled=true;hintDir=null;message.textContent='小猫正在认真思考…';render();
 function batch(){
  if(ticket!==hintRun)return;
  let stop=Math.min(head+400,queue.length);
  while(head<stop){let item=queue[head++],arr=item.a;
   if(arr[0][0]===3&&arr[0][1]===1){
    button.disabled=false;
    if(!item.first){message.textContent='曹操猫已经到达出口啦！';return}
    const [i,dir,label]=item.first;selected=pieces[i].id;hintDir=dir;message.textContent=`小提示：将${pieces[i].name}向${label}移动一格 🐾`;render();return;
   }
   for(let i=0;i<arr.length;i++){const [r,c]=arr[i],[w,h]=dims[i];
    for(const [dir,dr,dc,label] of options){let nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr+h>5||nc+w>4)continue;
     let blocked=arr.some(([rr,cc],j)=>j!==i&&nr<rr+dims[j][1]&&nr+h>rr&&nc<cc+dims[j][0]&&nc+w>cc);if(blocked)continue;
     let next=arr.slice();next[i]=[nr,nc];let k=key(next);if(seen.has(k))continue;seen.add(k);queue.push({a:next,first:item.first||[i,dir,label]});
    }
   }
  }
  if(head<queue.length)setTimeout(batch,0);else{button.disabled=false;message.textContent='暂时没有找到解法，可以试试撤销或重新开始。'}
 }
 setTimeout(batch,0);
}
document.querySelector('#hint').onclick=findHint;
document.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(k&&selected){e.preventDefault();move(...dirs[k])}});reset();
</script></body></html>
