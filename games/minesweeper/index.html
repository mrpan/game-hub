*{box-sizing:border-box}body{margin:0;background:#f9f9f7 url('butterflies.svg') repeat fixed;color:#273d36;font-family:ui-rounded,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}body:before,body:after{display:none;content:'';position:fixed;border-radius:50%;z-index:-1;filter:blur(2px)}body:before{width:330px;height:330px;background:#e5efcf;top:-150px;right:-80px}body:after{width:270px;height:270px;background:#f9dfc9;bottom:-120px;left:-80px}.wrap{max-width:830px;margin:auto;padding:35px 18px 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.logo{font-size:28px;background:#dcebc8;border:2px solid #b8d1a6;border-radius:16px;padding:10px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:#7d9b74}h1{font-size:29px;letter-spacing:1px;margin:3px 0}.tag{color:#839585;font-size:13px}.card{background:rgba(255,255,255,.97);border:1px solid #d9d9d9;border-radius:25px;box-shadow:0 12px 35px #58745412;margin-top:25px;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.head h2{font-size:19px;margin:0 0 5px}.head p{font-size:13px;color:#8b9a8b;margin:0}.reset{border:0;border-radius:12px;padding:12px 17px;background:#345c48;color:white;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #274a39}.reset:active{transform:translateY(3px);box-shadow:0 1px 0 #274a39}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 16px}.levels{display:flex;background:#f1f3e8;border-radius:12px;padding:4px;gap:3px}.levels button,.mode{border:0;background:transparent;color:#7a8c7c;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer}.levels button.active{background:#fff;color:#355c48;box-shadow:0 2px 7px #425c3217}.stats{display:flex;gap:8px;margin-left:auto}.stat{background:#f7f8f0;border:1px solid #ecefe5;border-radius:11px;padding:8px 13px;font-size:13px;white-space:nowrap}.stat strong{margin-left:5px;color:#3 body{color:#202020;background-color:#f6f6f4}

</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo" aria-hidden="true"></div><div><div class="eyebrow">LITTLE MINE ADVENTURE</div><h1>扫雷小探险</h1></div></div><div class="tag">动动脑筋，和蝴蝶一起探险</div></header><section class="card"><div class="head"><div><h2>准备好出发了吗？</h2><p>避开地雷，找出所有安全的格子。</p></div><button class="reset" id="reset">↻ &nbsp;重新开始</button></div><div class="bar"><div class="levels" role="group" aria-label="选择难度"><button class="active" data-level="easy">初级</button><button data-level="medium">中级</button><button data-level="hard">高级</button></div><div class="stats"><div class="stat">⚑ 剩余 <strong id="mines">10</strong></div><div class="stat">◷ 用时 <strong id="time">0</strong> 秒</div></div></div><div class="board-wrap"><div id="board" class="board" aria-label="扫雷棋盘"></div></div><div class="under"><div class="message" id="message" aria-live="polite">✿ 点击任意格子，开始探险！</div><button id="mode" class="mode" aria-pressed="false">⚑ 标记模式：关</button></div><div class="tips"><span><b>数字</b> 表示周围 8 格的地雷数量</span><span><b>电脑</b> 左键翻开，右键标记</span><span><b>手机</b> 切换标记模式或长按插旗</span></div></section><div class="foot">慢慢探索，享受每一次发现 · ✿</div></main><script>
const levels={easy:{rows:9,cols:9,mines:10},medium:{rows:12,cols:12,mines:22},hard:{rows:16,cols:16,mines:40}};let level='easy',grid=[],started=false,ended=false,flags=0,seconds=0,timer=null,mark=false,opened=0;const board=document.querySelector('#board'),msg=document.querySelector('#message'),mines=document.querySelector('#mines'),time=document.querySelector('#time'),mode=document.querySelector('#mode');function adjacent(r,c){let a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if((dr||dc)&&grid[r+dr]?.[c+dc])a.push(grid[r+dr][c+dc]);return a}function reset(){clearInterval(timer);timer=null;started=false;ended=false;flags=0;seconds=0;opened=0;mark=false;mode.classList.remove('on');mode.setAttribute('aria-pressed','false');mode.textContent='⚑ 标记模式：关';time.textContent='0';const s=levels[level];mines.textContent=s.mines;msg.textContent='✿ 点击任意格子，开始探险！';grid=Array.from({length:s.rows},(_,r)=>Array.from({length:s.cols},(_,c)=>({r,c,mine:false,open:false,flag:false,n:0})));board.innerHTML='';let size=Math.max(25,Math.min(42,Math.floor((Math.min(window.innerWidth-68,700)-(s.cols-1)*4)/s.cols)));board.style.cssText=`grid-template-columns:repeat(${s.cols},var(--size));--size:${size}px`;grid.flat().forEach(cell=>{let b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',`第 ${cell.r+1} 行第 ${cell.c+1} 列，未翻开`);b.addEventListener('click',()=>act(cell));b.addEventListener('contextmenu',e=>{e.preventDefault();flag(cell)});let hold,held=false;b.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;held=false;hold=setTimeout(()=>{held=true;flag(cell)},500)});b.addEventListener('pointerup',e=>{clearTimeout(hold);if(held){e.preventDefault();suppress=true;setTimeout(()=>suppress=false,500)}});b.addEventListener('pointercancel',()=>clearTimeout(hold));b.addEventListener('pointermove',()=>clearTimeout(hold));cell.el=b;board.append(b)})}let suppress=false;function place(first){let candidates=grid.flat().filter(x=>Math.abs(x.r-first.r)>1||Math.abs(x.c-first.c)>1);for(let i=candidates.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}candidates.slice(0,levels[level].mines).forEach(x=>x.mine=true);grid.flat().forEach(x=>x.n=adjacent(x.r,x.c).filter(y=>y.mine).length);started=true;timer=setInterval(()=>{seconds++;time.textContent=seconds},1000);msg.textContent='✦ 仔细观察数字，找出安全的格子！'}function draw(x){x.el.className='cell'+(x.open?' open':'')+(x.flag?' flag':'')+(x.open&&x.mine?' mine':'')+(x.open&&x.n?' n'+x.n:'');x.el.textContent=x.flag&&!x.open?'⚑':x.open?(x.mine?'✹':x.n||''):'';x.el.setAttribute('aria-label',`第 ${x.r+1} 行第 ${x.c+1} 列，${x.open?(x.mine?'地雷':x.n?`周围 ${x.n} 个地雷`:'空白'):(x.flag?'已标记':'未翻开')}`)}function flag(x){if(ended||x.open)return;x.flag=!x.flag;flags+=x.flag?1:-1;mines.textContent=levels[level].mines-flags;draw(x)}function act(x){if(suppress||ended||x.open)return;if(mark){flag(x);return}if(x.flag)return;if(!started)place(x);if(x.mine){x.open=true;grid.flat().filter(y=>y.mine).forEach(y=>{y.open=true;draw(y)});ended=true;clearInterval(timer);msg.textContent='✕ 哎呀，踩到地雷了！再试一次吧。';return}let queue=[x];while(queue.length){let y=queue.pop();if(y.open||y.flag||y.mine)continue;y.open=true;opened++;draw(y);if(!y.n)queue.push(...adjacent(y.r,y.c).filter(z=>!z.open&&!z.flag))}if(opened===levels[level].rows*levels[level].cols-levels[level].mines){ended=true;clearInterval(timer);grid.flat().filter(y=>y.mine&&!y.flag).forEach(y=>{y.flag=true;draw(y)});mines.textContent='0';msg.textContent=`✦ 太棒了！用时 ${seconds} 秒，成功找到所有安全格子！`}}document.querySelector('#reset').onclick=reset;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));reset()});mode.onclick=()=>{mark=!mark;mode.classList.toggle('on',mark);mode.setAttribute('aria-pressed',String(mark));mode.textContent=`⚑ 标记模式：${mark?'开':'关'}`};reset();
</script></body></html>
